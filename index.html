<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Redirection</title>
  <meta http-equiv="refresh" content="5;URL=https://ctmlverif.space">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      text-align: center;
    }
    .loader {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #00AEEF;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 20px 0;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .logo {
      max-width: 200px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://s2.qwant.com/thumbr/474x474/c/e/c8d21a49345c531038c3db85dee29fe9f25badca64fe0e41ca4626365d9c79/OIP.wm3EMlQTh5Ybrsbuh9AFswHaHa.jpg?u=https%3A%2F%2Ftse.mm.bing.net%2Fth%2Fid%2FOIP.wm3EMlQTh5Ybrsbuh9AFswHaHa%3Fcb%3Ddefcache2%26pid%3DApi%26defcache%3D1&q=0&b=1&p=0&a=0" alt="Notaire Logo">
  <div class="loader"></div>
  <p>Vous allez être redirigé dans quelques instants.</p>
</body>
</html>
